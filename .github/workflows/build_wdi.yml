name: Build WDI panel

# Runs only when the generator itself changes, so the generated CSV commit
# does not re-trigger this workflow.
on:
  push:
    branches: [arena/ec3b8da6-phd]
    paths:
      - "scripts/fetch_wdi.py"
      - "requirements-wdi.txt"
      - ".github/workflows/build_wdi.yml"

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: arena/ec3b8da6-phd

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pip install -r requirements-wdi.txt

      - name: Fetch WDI data and build the panel
        run: python scripts/fetch_wdi.py

      - name: Upload CSV as a run artifact
        uses: actions/upload-artifact@v4
        with:
          name: wdi-gdp-trade-population-2000-2024
          path: wdi_gdp_trade_population_2000_2024.csv
          if-no-files-found: error

      - name: Commit CSV back to this branch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add wdi_gdp_trade_population_2000_2024.csv
          if git diff --cached --quiet; then
            echo "CSV unchanged; nothing to commit."
          else
            git commit -m "data: add WDI GDP/trade/population panel 2000-2024 [skip ci]"
            git push origin HEAD:arena/ec3b8da6-phd
          fi
